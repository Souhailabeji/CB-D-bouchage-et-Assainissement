name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href /

      - name: Find Angular build output
        id: find-dist
        shell: bash
        run: |
          set -e

          echo "Recherche de index.html dans dist/"

          if [ -f "dist/index.html" ]; then
            BUILD_PATH="dist"
          else
            INDEX_FILE=$(find dist -mindepth 2 -maxdepth 4 -type f -name index.html -print -quit)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERREUR : index.html introuvable dans dist/"
              find dist -maxdepth 4 -type f | head -100
              exit 1
            fi

            BUILD_PATH=$(dirname "$INDEX_FILE")
          fi

          echo "Dossier de publication : $BUILD_PATH"
          echo "path=$BUILD_PATH" >> "$GITHUB_OUTPUT"

      - name: Add custom domain
        run: |
          echo "www.cb-debouchage-assainissement.fr" > "${{ steps.find-dist.outputs.path }}/CNAME"

      - name: Create 404.html for Angular routes
        run: |
          cp "${{ steps.find-dist.outputs.path }}/index.html" "${{ steps.find-dist.outputs.path }}/404.html"

      - name: Verify publication files
        run: |
          test -f "${{ steps.find-dist.outputs.path }}/index.html"
          test -f "${{ steps.find-dist.outputs.path }}/404.html"
          test -f "${{ steps.find-dist.outputs.path }}/CNAME"
          echo "Fichiers de publication vérifiés."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.find-dist.outputs.path }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4