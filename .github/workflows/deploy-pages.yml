
name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href /

      - name: Find Angular build output
        id: find-dist
        shell: bash
        run: |
          echo "Contenu de dist :"
          find dist -maxdepth 3 -type f | head -50

          if [ -f "dist/index.html" ]; then
            echo "path=dist" >> "$GITHUB_OUTPUT"

          elif find dist -mindepth 2 -maxdepth 3 -name index.html | grep -q .; then
            BUILD_PATH=$(dirname "$(find dist -mindepth 2 -maxdepth 3 -name index.html | head -1)")
            echo "path=$BUILD_PATH" >> "$GITHUB_OUTPUT"

          else
            echo "ERREUR : index.html introuvable dans dist/"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.find-dist.outputs.path }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4
