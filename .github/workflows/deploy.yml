name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href /

      - name: Verify Angular build
        shell: bash
        run: |
          echo "===== Contenu de dist/trezo ====="
          find dist/trezo -maxdepth 3 -type f | head -100

          echo "===== Vérification index.html ====="

          if [ -f "dist/trezo/browser/index.html" ]; then
            echo "index.html trouvé dans dist/trezo/browser/"
          else
            echo "ERREUR : dist/trezo/browser/index.html introuvable"
            exit 1
          fi

          echo "===== Vérification base href ====="
          grep '<base href=' dist/trezo/browser/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/trezo/browser

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4