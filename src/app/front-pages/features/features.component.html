<div class="pt-[25px] md:pt-[45px] lg:pt-[85px] xl:pt-[95px] text-center">
  <div class="container 2xl:max-w-[1320px] mx-auto px-[12px] relative z-[1]">
    <h1
      class="mb-0 leading-[1.2] text-[32px] md:text-[40px] lg:text-[50px] xl:text-[60px] -tracking-[.5px] md:-tracking-[1px] xl:-tracking-[1.5px] text-gray-900 dark:text-white">
      Services
    </h1>
  </div>
</div>
<div class="pt-[30px] md:pt-[40px] lg:pt-[50px] xl:pt-[75px] mb-[60px]">
  <div class="container 2xl:max-w-[1320px] mx-auto px-[12px] relative z-[1]">
    <div class="md:max-w-[500px] lg:max-w-[630px] mb-[35px] md:mb-[50px] lg:mb-[65px] xl:mb-[90px]">
      <div class="inline-block relative mt-[10px] mb-[20px]">
        <span
          class="absolute top-[4.5px] w-[5px] h-[5px] ltr:-left-[3.6px] rtl:-right-[3.6px] bg-[#644a9e] -rotate-[6.536deg]"></span>
        <span
          class="absolute -top-[9.5px] w-[5px] h-[5px] ltr:right-0 rtl:left-0 bg-[#644a9e] -rotate-[6.536deg]"></span>
        <span
          class="inline-block relative text-[#644a9e] border border-[#644a9e] py-[5.5px] px-[17.2px] -rotate-[6.536deg]">
          Services
          <span
            class="absolute -bottom-[2.5px] w-[5px] h-[5px] ltr:-left-[3.5px] rtl:-right-[3.5px] bg-[#644a9e] -rotate-[6.536deg]"></span>
          <span
            class="absolute -bottom-[2.5px] w-[5px] h-[5px] ltr:-right-[3.5px] rtl:-left-[3.5px] bg-[#644a9e] -rotate-[6.536deg]"></span>
        </span>
      </div>
      <h2
        class="mb-0 text-[24px] md:text-[28px] lg:text-[34px] xl:text-[36px] -tracking-[.5px] md:-tracking-[.6px] lg:-tracking-[.8px] xl:-tracking-[1px] leading-[1.2] text-gray-900 dark:text-white">
        Browse through the services we specialize in.
      </h2>
    </div>
    <!-- Services Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 2xl:grid-cols-4 gap-[25px]">
      <div *ngFor="let service of services; let i = index"
        class="relative bg-white dark:bg-[#0c1427] p-6 rounded-xl text-center overflow-hidden transition-all duration-500 border hover:border-[#0d8ed6] group">

        <div class="relative z-10 flex flex-col items-center transition-all duration-500 group-hover:-translate-y-12">
          <div class="mb-5 transition-all duration-500 group-hover:opacity-0 rounded-full p-3 dark:bg-white">
            <img [src]="service.image" [alt]="service.title" class="w-[40px] h-[40px]" />
          </div>

          <a [routerLink]="['/', service.url]"
            class="text-lg font-bold mb-2 transition-all duration-300 cursor-pointer text-gray-900 dark:text-white">
            {{ service.title }}
          </a>
          <p class="text-sm transition-all duration-300 text-gray-600 dark:text-gray-300">
            {{ service.description }}
          </p>
        </div>

        <a [routerLink]="['/', service.url]"
          class="absolute bottom-6 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all duration-500 flex items-center justify-center text-2xl text-[#0d8ed6]">
          <i class="material-symbols-outlined">arrow_forward</i>
        </a>
      </div>
    </div>
  </div>
</div>
