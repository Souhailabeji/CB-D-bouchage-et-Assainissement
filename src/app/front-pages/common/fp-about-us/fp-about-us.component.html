<div class="relative z-10 bg-white py-12 sm:py-16 md:py-20 lg:py-[100px] overflow-hidden">

<!-- BUBBLES BACKGROUND -->
<div class="qode-work-bubble qode-work-bubble--blue"></div>
<div class="qode-work-bubble qode-work-bubble--violet"></div>

  <div class="container max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8">


    <!-- Title -->
    <h2
      class="font-poppins text-4xl sm:text-5xl md:text-[56px] lg:text-[64px] leading-tight font-medium text-center text-[#0a0a23] mb-10 md:mb-14">
      {{ 'WORK.title' | translate }}
    </h2>


    <div class="relative flex flex-col gap-6 md:gap-8 max-w-6xl mx-auto">

      <!-- Decorative -->
      <div class="hidden md:block bubble-decor-1 hex-glass"></div>
      <div class="hidden md:block bubble-decor-2 hex-glass"></div>

      <!-- ROW 1 -->
      <div class="grid grid-cols-1 md:grid-cols-5 gap-6">

        <!-- Parcel -->
        <a href="app"
          class="group relative overflow-hidden rounded-[30px] md:rounded-[45px] 
                 h-[280px] sm:h-[380px] lg:h-[500px]
                 md:col-span-2 bg-black">
          <img
            src="/images/projt1.webp"
            [alt]="'WORK.parcelAlt' | translate"
            class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
          <div class="absolute bottom-5 left-5 right-5 flex justify-between items-center">
            <span class="font-poppins text-white text-lg sm:text-xl md:text-2xl font-medium">
              {{ 'WORK.parcel' | translate }}
            </span>
            <span class="w-9 h-9 rounded-full flex items-center justify-center bg-white/20 backdrop-blur">
              <i class="material-symbols-outlined text-white text-[18px]">north_east</i>
            </span>
          </div>
        </a>

        <!-- Restaurant -->
        

      </div>


      <!-- ROW 2 -->
      <div class="grid grid-cols-1 md:grid-cols-5 gap-6">

        <!-- Cars -->
        <a href="/cars"
          class="group relative overflow-hidden rounded-[30px] md:rounded-[45px]
                 h-[280px] sm:h-[380px] lg:h-[500px]
                 md:col-span-3 bg-black">
          <img
            src="/images/proj3.webp"
            [alt]="'WORK.carsAlt' | translate"
            class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
          <div class="absolute bottom-5 left-5 right-5 flex justify-between items-center">
            <span class="font-poppins text-white text-lg sm:text-xl md:text-2xl font-medium">
              {{ 'WORK.cars' | translate }}
            </span>
            <span class="w-9 h-9 rounded-full flex items-center justify-center bg-white/20 backdrop-blur">
              <i class="material-symbols-outlined text-white text-[18px]">north_east</i>
            </span>
          </div>
        </a>

        <!-- Padel -->
        <a href="/padel"
          class="group relative overflow-hidden rounded-[30px] md:rounded-[45px]
                 h-[280px] sm:h-[380px] lg:h-[500px]
                 md:col-span-2 bg-black ring-1 ring-blue-400/50">
          <img
            src="/images/proj4.webp"
            [alt]="'WORK.padelAlt' | translate"
            class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
          <div class="absolute bottom-5 left-5 right-5 flex justify-between items-center">
            <span class="font-poppins text-white text-lg sm:text-xl md:text-2xl font-medium">
              {{ 'WORK.padel' | translate }}
            </span>
            <span class="w-9 h-9 rounded-full flex items-center justify-center bg-white/20 backdrop-blur">
              <i class="material-symbols-outlined text-white text-[18px]">north_east</i>
            </span>
          </div>
        </a>

      </div>

    </div>


    <!-- STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-8 md:gap-12 max-w-4xl mx-auto mt-14 md:mt-20">

      <div class="text-center">
        <p class="font-poppins font-bold text-2xl md:text-[28px] text-[#0a0a23] mb-2">1M+</p>
        <h5 class="font-poppins text-sm text-[#252525cc] leading-relaxed max-w-[220px] mx-auto">
          {{ 'WORK.stat1' | translate }}
        </h5>
      </div>

      <div class="text-center">
        <p class="font-poppins font-bold text-2xl md:text-[28px] text-[#0a0a23] mb-2">92%</p>
        <h5 class="font-poppins text-sm text-[#252525cc] leading-relaxed max-w-[220px] mx-auto">
          {{ 'WORK.stat2' | translate }}
        </h5>
      </div>

      <div class="text-center">
        <p class="font-poppins font-bold text-2xl md:text-[28px] text-[#0a0a23] mb-2">4.9/5.0</p>
        <h5 class="font-poppins text-sm text-[#252525cc] leading-relaxed max-w-[220px] mx-auto">
          {{ 'WORK.stat3' | translate }}
        </h5>
      </div>

    </div>

  </div>

</div>
