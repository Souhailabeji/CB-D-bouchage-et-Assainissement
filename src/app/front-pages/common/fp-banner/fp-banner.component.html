<div
  class="relative w-full min-h-screen md:h-screen
         overflow-hidden text-white cursor-default"
>

  <!-- VIDEO BACKGROUND -->
  <video
    #bgVideo
    class="absolute inset-0 w-full h-full object-cover object-center z-0
           brightness-[1.12] contrast-[1.08] saturate-[1.12]"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="/images-original/debouchage_30s.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>


  <!-- OVERLAY -->
  <div
    class="absolute inset-0 z-[1]
           bg-gradient-to-b
           from-black/5
           via-black/15
           to-black/35">
  </div>



  <!-- CONTENT -->
  <div
    class="absolute bottom-0 left-0 w-full z-[2]
           px-4 sm:px-8 lg:px-16 xl:px-24
           pb-8 sm:pb-12 md:pb-16
           mb-20 sm:mb-28 md:mb-36 lg:mb-44"
  >


    <div
      class="
      w-full

      flex
      flex-col

      gap-6

      lg:flex-row
      lg:justify-between
      lg:items-end
      "
    >


      <!-- TITLE -->
      <h1
        class="
        text-left

        ml-0
        sm:ml-4
        lg:ml-8


        text-[30px]
        sm:text-[50px]
        md:text-[70px]
        lg:text-[99px]
        xl:text-[100px]


        leading-[1.05]

        font-poppins
        font-normal

        text-white


        max-w-full
        lg:max-w-[1000px]


        break-words


        drop-shadow-[0_8px_25px_rgba(0,0,0,0.45)]
        "
      >
        {{ 'hero.title' | translate }}
      </h1>




      <!-- BUTTON RIGHT -->

<a
  href="tel:+33602791208"
  (click)="trackPhoneClick('hero')"

  class="
  self-start

  lg:self-auto


  px-10
  py-5

  sm:px-16
  sm:py-7

  md:px-20
  md:py-8


  text-xl
  sm:text-3xl
  md:text-4xl


  rounded-full


  border-2
  border-orange-400


  bg-orange-500

  shadow-[0_8px_30px_rgba(249,115,22,0.5)]


  text-white

  font-semibold


  transition-all

  duration-300


  hover:bg-orange-600

  hover:border-orange-300

  hover:shadow-[0_10px_40px_rgba(249,115,22,0.7)]

  hover:scale-110


  whitespace-nowrap
  "
>
  {{ 'hero.contactButton' | translate }}
</a>



    </div>


  </div>


</div>
