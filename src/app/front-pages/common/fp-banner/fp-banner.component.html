

<div
  class="relative w-full min-h-screen md:h-screen
         overflow-hidden text-white cursor-default"
>

  <!-- VIDEO BACKGROUND -->
  <video
    #bgVideo
    class="absolute inset-0 w-full h-full object-cover object-center z-0
           brightness-[1.12] contrast-[1.08] saturate-[1.12]"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="/images/debouchage_30s.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>


  <!-- OVERLAY -->
  <div
    class="absolute inset-0 z-[1]
           bg-gradient-to-b
           from-black/5
           via-black/15
           to-black/35">
  </div>



  <!-- CONTENT -->
  <div
    class="absolute bottom-0 left-0 w-full z-[2]
           px-4 sm:px-8 lg:px-16 xl:px-24
           pb-8 sm:pb-12 md:pb-16"
  >


    <div
      class="
      w-full

      flex
      flex-col

      gap-6

      lg:flex-row
      lg:justify-between
      lg:items-end
      "
    >


      <!-- TITLE -->
      <h1
        class="
        text-left

        ml-0
        sm:ml-4
        lg:ml-8


        text-[30px]
        sm:text-[50px]
        md:text-[70px]
        lg:text-[99px]
        xl:text-[100px]


        leading-[1.05]

        font-poppins
        font-normal

        text-white


        max-w-full
        lg:max-w-[1000px]


        break-words


        drop-shadow-[0_8px_25px_rgba(0,0,0,0.45)]
        "
      >
        {{ 'hero.title' | translate }}
      </h1>




      <!-- BUTTON RIGHT -->
      <a
        href="tel:0753696428"

        class="
        self-start

        lg:self-auto


        px-9
        py-4

        sm:px-14
        sm:py-6


        text-base
        sm:text-xl


        rounded-full


        border
        border-white/40


        backdrop-blur-md

        bg-white/10


        text-white

        font-medium


        transition-all

        duration-300


        hover:bg-white

        hover:text-[#484546]

        hover:border-white

        hover:scale-105


        whitespace-nowrap
        "
      >
        {{ 'hero.contactButton' | translate }}
      </a>



    </div>


  </div>


</div>
