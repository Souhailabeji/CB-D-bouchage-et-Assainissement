<button type="button" class="light-dark-toggle leading-none inline-block transition-all text-[#fe7a36] fixed top-4 md:top-6 right-4 md:right-6 z-50" (click)="toggleTheme()">
    <i class="material-symbols-outlined !text-lg sm:!text-xl md:!text-2xl">{{ isDarkMode ? 'dark_mode' : 'light_mode' }}</i>
  </button>
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" *ngIf="isSignUpPopupOpen" (click)="closeSignUpPopup()">

        <button type="button" class="w-full sm:flex-1 py-2 px-3 sm:px-4 rounded-md border border-[#D6DAE1] dark:border-[#172036] bg-white dark:bg-[#0a0e19] hover:border-primary-500 transition-all">
          <img src="images/icons/google.svg" class="inline-block w-4 h-4 sm:w-5 sm:h-5" alt="google">
        </button>
        <button type="button" class="w-full sm:flex-1 py-2 px-3 sm:px-4 rounded-md border border-[#D6DAE1] dark:border-[#172036] bg-white dark:bg-[#0a0e19] hover:border-primary-500 transition-all">
          <img src="images/icons/facebook2.svg" class="inline-block w-4 h-4 sm:w-5 sm:h-5" alt="facebook">
        </button>
        <button type="button" class="w-full sm:flex-1 py-2 px-3 sm:px-4 rounded-md border border-[#D6DAE1] dark:border-[#172036] bg-white dark:bg-[#0a0e19] hover:border-primary-500 transition-all">
          <img src="images/icons/apple.svg" class="inline-block w-4 h-4 sm:w-5 sm:h-5" alt="apple">
        </button>
      </div>
      <form (ngSubmit)="onSignUpSubmit()">
        <div class="mb-3 sm:mb-4">
          <label class="block text-xs sm:text-sm font-medium text-gray-900 dark:text-white mb-1 sm:mb-2">Full Name</label>
          <input type="text" [(ngModel)]="fullName" name="fullName" class="w-full py-2 sm:py-3 px-3 sm:px-4 rounded-md border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none transition-all text-sm sm:text-base" placeholder="Enter your full name" required>
        </div>
        <div class="mb-3 sm:mb-4">
          <label class="block text-xs sm:text-sm font-medium text-gray-900 dark:text-white mb-1 sm:mb-2">Email Address</label>
          <input type="email" [(ngModel)]="email" name="email" class="w-full py-2 sm:py-3 px-3 sm:px-4 rounded-md border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none transition-all text-sm sm:text-base" placeholder="example@trezo.com" required>
        </div>
        <div class="mb-4 sm:mb-6 relative">
          <label class="block text-xs sm:text-sm font-medium text-gray-900 dark:text-white mb-1 sm:mb-2">Password</label>
          <input [type]="isPasswordVisible ? 'text' : 'password'" [(ngModel)]="password" name="password" class="w-full py-2 sm:py-3 px-3 sm:px-4 rounded-md border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none transition-all text-sm sm:text-base" placeholder="Type password" required>
          <button type="button" class="absolute right-2 sm:right-3 top-1/2 translate-y-1/2 text-gray-500 hover:text-primary-500 transition-colors" (click)="togglePasswordVisibility()">
            <i [ngClass]="isPasswordVisible ? 'ri-eye-line' : 'ri-eye-off-line'" class="text-lg sm:text-xl"></i>
          </button>
        </div>
        <button type="submit" class="w-full py-2 sm:py-3 px-3 sm:px-4 text-white bg-primary-500 rounded-md font-medium hover:bg-primary-400 transition-all text-sm sm:text-base">
          <span class="flex items-center justify-center gap-1 sm:gap-2">
            <i class="material-symbols-outlined text-lg sm:text-xl">person_4</i>

        </button>
      </form>
      <p class="text-xs text-gray-600 dark:text-gray-400 mt-3 sm:mt-4">

      </p>
      <p class="text-xs text-gray-600 dark:text-gray-400 mt-2">
        Already have an account? <a routerLink="/authentication" class="text-primary-500 hover:underline font-semibold">Sign In</a>
      </p>
    </div>
  </div>-->
  <!-- Light/Dark Mode Button -->
<button type="button" class="light-dark-toggle leading-none inline-block transition-all text-[#fe7a36] absolute top-[20px] md:top-[25px] ltr:right-[20px] rtl:left-[20px] ltr:md:right-[25px] rtl:md:left-[25px]" (click)="toggleTheme()">
  <i class="material-symbols-outlined !text-[20px] md:!text-[22px]">
      light_mode
  </i>
</button>

<!-- Sign Up -->
<div class="bg-white dark:bg-[#0a0e19] py-[60px] md:py-[80px] lg:py-[120px] xl:py-[135px]">
  <div class="mx-auto px-[12.5px] md:max-w-[720px] lg:max-w-[960px] xl:max-w-[1255px]">
      <div class="grid lg:grid-cols-2 gap-[25px] items-center">
          <!--<div class="xl:ltr:-mr-[25px] xl:rtl:-ml-[25px] 2xl:ltr:-mr-[45px] 2xl:rtl:-ml-[45px] rounded-[25px] order-2 lg:order-1">
              <img src="images/sign-up.webp" alt="sign-up-image" class="rounded-[25px]">
          </div>-->
          <div class="xl:ltr:pl-[90px] xl:rtl:pr-[90px] 2xl:ltr:pl-[120px] 2xl:rtl:pr-[120px] order-1 lg:order-2">
              <img src="images/logo-light.webp" alt="logo" class="inline-block dark:hidden">
              <img src="images/logo-dark.webp" alt="logo" class="hidden dark:inline-block">
              <div class="my-[17px] md:my-[25px]">
                  <h1 class="font-semibold text-[22px] md:text-xl lg:text-2xl mb-[5px] md:mb-[7px]">
                      Sign Up to Trezo Dashboard
                  </h1>
                  <p class="font-medium lg:text-md text-[#445164] dark:text-gray-400">
                      Sign Up with social account or enter your details
                  </p>
              </div>
              <div class="flex items-center justify-between mb-[20px] md:mb-[23px] gap-[12px]">
                  <div class="grow">
                      <button type="button" class="block text-center w-full rounded-md transition-all py-[8px] md:py-[10.5px] px-[15px] md:px-[25px] text-black dark:text-white border border-[#D6DAE1] bg-white dark:bg-[#0a0e19] dark:border-[#172036] shadow-sm hover:border-primary-500">
                          <img src="images/icons/google.svg" class="inline-block" alt="google">
                      </button>
                  </div>
                  <div class="grow">
                      <button type="button" class="block text-center w-full rounded-md transition-all py-[8px] md:py-[10.5px] px-[15px] md:px-[25px] text-black dark:text-white border border-[#D6DAE1] bg-white dark:bg-[#0a0e19] dark:border-[#172036] shadow-sm hover:border-primary-500">
                          <img src="images/icons/facebook2.svg" class="inline-block" alt="google">
                      </button>
                  </div>
                  <div class="grow">
                      <button type="button" class="block text-center w-full rounded-md transition-all py-[8px] md:py-[10.5px] px-[15px] md:px-[25px] text-black dark:text-white border border-[#D6DAE1] bg-white dark:bg-[#0a0e19] dark:border-[#172036] shadow-sm hover:border-primary-500">
                          <img src="images/icons/apple.svg" class="inline-block" alt="google">
                      </button>
                  </div>
              </div>
              <div class="mb-[15px] relative">
                  <label class="mb-[10px] md:mb-[12px] text-black dark:text-white font-medium block">
                      Full Name
                  </label>
                  <input type="text" class="h-[55px] rounded-md text-black dark:text-white border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] px-[17px] block w-full outline-0 transition-all placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:border-primary-500" placeholder="Enter your full name">
              </div>
              <div class="mb-[15px] relative">
                  <label class="mb-[10px] md:mb-[12px] text-black dark:text-white font-medium block">
                      Email Address
                  </label>
                  <input type="text" class="h-[55px] rounded-md text-black dark:text-white border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] px-[17px] block w-full outline-0 transition-all placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:border-primary-500" placeholder="example@trezo.com">
              </div>
              <div class="mb-[15px] relative" id="passwordHideShow">
                  <label class="mb-[10px] md:mb-[12px] text-black dark:text-white font-medium block">
                      Password
                  </label>
                  <input [type]="isPasswordVisible ? 'text' : 'password'" [value]="password" (input)="onPasswordInput($event)" class="h-[55px] rounded-md text-black dark:text-white border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] px-[17px] block w-full outline-0 transition-all placeholder:text-gray-500 dark:placeholder:text-gray-400 focus:border-primary-500" id="password" placeholder="Type password">
                  <button class="absolute text-lg ltr:right-[20px] rtl:left-[20px] bottom-[12px] transition-all hover:text-primary-500" (click)="togglePasswordVisibility()" type="button">
                      <i [ngClass]="isPasswordVisible ? 'ri-eye-line' : 'ri-eye-off-line'"></i>
                  </button>
              </div>
              <button type="submit" class="md:text-md block w-full text-center transition-all rounded-md font-medium my-[20px] md:my-[25px] py-[12px] px-[25px] text-white bg-primary-500 hover:bg-primary-400">
                  <span class="flex items-center justify-center gap-[5px]">
                      <i class="material-symbols-outlined">
                          person_4
                      </i>
                      Sign Up
                  </span>
              </button>
              <p class="leading-[1.6]">
                  By confirming your email, you agree to our <a routerLink="." class="font-medium text-black dark:text-white transition-all hover:text-primary-500">Terms of Service</a>  and that you have read and understood our <a routerLink="." class="font-medium text-black dark:text-white transition-all hover:text-primary-500">Privacy Policy</a>
              </p>
              <!--<p class="leading-[1.6]">
                  Already have an account. <a routerLink="/authentication" class="text-primary-500 transition-all font-semibold hover:underline">Sign In</a>
              </p>-->
          </div>
      </div>
  </div>
</div>
