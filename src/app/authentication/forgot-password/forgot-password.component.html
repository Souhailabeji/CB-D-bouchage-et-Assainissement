<!-- Light/Dark Mode Button -->
<button type="button" class="light-dark-toggle leading-none inline-block transition-all text-[#fe7a36] fixed top-2 sm:top-4 md:top-6 right-2 sm:right-4 md:right-6 z-50" (click)="toggleTheme()">
  <i class="material-symbols-outlined !text-base sm:!text-lg md:!text-xl lg:!text-2xl">{{ isDarkMode ? 'dark_mode' : 'light_mode' }}</i>
</button>

<!-- Forgot Password Popup -->
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-2 sm:px-0" *ngIf="isForgotPasswordPopupOpen" (click)="closeForgotPasswordPopup()">
  <div class="bg-white dark:bg-[#0a0e19] rounded-xl shadow-2xl p-3 sm:p-4 md:p-6 lg:p-8 w-full max-w-[90vw] sm:max-w-xs md:max-w-sm lg:max-w-md xl:max-w-lg mx-auto animate-fade-in-up overflow-y-auto max-h-[90vh]" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center mb-3 sm:mb-4 md:mb-6">
      <h2 class="text-base sm:text-lg md:text-xl lg:text-2xl font-semibold text-gray-900 dark:text-white">Forgot your password?</h2>
      <button type="button" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors" (click)="closeForgotPasswordPopup()">
        <i class="material-symbols-outlined text-base sm:text-lg md:text-xl">close</i>
      </button>
    </div>
    <p class="text-xs sm:text-sm md:text-base text-gray-600 dark:text-gray-400 mb-3 sm:mb-4 md:mb-6">
      Enter the email address you used when you joined and we’ll send you instructions to reset your password.
    </p>
    <form (ngSubmit)="onForgotPasswordSubmit()">
      <div class="mb-2 sm:mb-3 md:mb-4">
        <label class="block text-xs sm:text-sm md:text-base font-medium text-gray-900 dark:text-white mb-1 sm:mb-2">Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" class="w-full py-1 sm:py-2 md:py-3 px-2 sm:px-3 md:px-4 rounded-md border border-gray-200 dark:border-[#172036] bg-white dark:bg-[#0c1427] text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none transition-all text-xs sm:text-sm md:text-base" placeholder="example@gmail.com" required>
      </div>
      <button type="submit" class="w-full py-1 sm:py-2 md:py-3 px-2 sm:px-3 md:px-4 text-white bg-primary-500 
      rounded-md font-medium hover:bg-primary-400 transition-all text-xs sm:text-sm md:text-base">
        <span class="flex items-center justify-center gap-1 sm:gap-2">
          <i class="material-symbols-outlined text-base sm:text-lg md:text-xl">autorenew</i>
          Reset Password
        </span>
      </button>
    </form>
    <p class="text-xs sm:text-sm md:text-base text-gray-600 dark:text-gray-400 mt-2 sm:mt-3 md:mt-4">
      Back to <a routerLink="/authentication" class="text-primary-500 hover:underline font-semibold">Sign In</a>
    </p>
  </div>
</div>
